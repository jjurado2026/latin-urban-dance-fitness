<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Propuesta caducada | Latin Urban Dance &amp; Fitness</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B0B0F">
<meta name="color-scheme" content="dark">
<link rel="preload" href="assets/fonts/anybody.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230B0B0F'/><path d='M8 7v18h16' fill='none' stroke='%2364FEDA' stroke-width='4'/></svg>">
<!-- =====================================================================
     Aviso de caducidad de la propuesta (index.html redirige aquí pasados
     10 días desde el envío). La «foto pequeña de la home entera» es una
     ventana estrecha por la que la captura completa baja despacio.
     ===================================================================== -->
<style>
@font-face{font-family:'Anybody';src:url('assets/fonts/anybody.woff2') format('woff2');font-weight:100 900;font-stretch:50% 150%;font-display:swap}
@font-face{font-family:'Archivo';src:url('assets/fonts/archivo.woff2') format('woff2');font-weight:100 900;font-stretch:62% 125%;font-display:swap}

:root{
  --negro:#0B0B0F;
  --negro-2:#131318;
  --linea:#27272F;
  --turquesa:#64FEDA;
  --azul:#304FFF;
  --naranja:#FF9620;
  --magenta:#FF17A9;
  --blanco:#FFFFFF;
  --texto-suave:#B7B9C6;
  --fuego-h:linear-gradient(100deg,#FF9620 0%,#FF5E5C 50%,#FF17A9 100%);
  --display:'Anybody','Arial Narrow',Impact,sans-serif;
  --cuerpo:'Archivo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --margen:clamp(18px,4.5vw,56px);
  /* la ventana de la home: ancho y alto */
  --ventana-w:300px;
  --ventana-h:min(460px, calc(100svh - 190px));
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100svh;
  display:flex;flex-direction:column;
  background:
    radial-gradient(48% 60% at 78% 52%, rgba(48,79,255,.16), transparent 70%),
    radial-gradient(40% 50% at 18% 100%, rgba(255,23,169,.08), transparent 70%),
    var(--negro);
  color:var(--texto-suave);
  font-family:var(--cuerpo);
  font-size:clamp(16px,.38vw + 15px,18px);
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--turquesa);outline-offset:4px;border-radius:4px}

.cab{padding:clamp(16px,3vh,28px) var(--margen) 0}
.cab img{width:auto;height:clamp(30px,4vw,40px)}

.aviso{
  flex:1;
  width:100%;max-width:1180px;margin-inline:auto;
  padding:clamp(24px,5vh,56px) var(--margen) clamp(28px,5vh,56px);
  display:grid;align-items:center;
  gap:clamp(32px,5vw,80px);
  grid-template-columns:minmax(0,1fr) auto;
}

.aviso__t{
  margin:0;
  max-width:19ch;
  font-family:var(--display);
  font-weight:800;font-stretch:96%;
  font-size:clamp(1.75rem,3.6vw,3.15rem);
  line-height:1.04;
  color:var(--blanco);
  text-wrap:balance;
}
.aviso__p{margin:clamp(20px,3vh,30px) 0 0;font-size:clamp(1.02rem,1.3vw,1.18rem);line-height:1.6}
/* el correo y su punto final, siempre en la misma línea */
.junto{white-space:nowrap}

/* El correo: la única llamada de la página */
.correo{
  position:relative;display:inline-block;
  margin-top:8px;padding-bottom:6px;
  font-family:var(--display);
  font-weight:800;font-stretch:100%;
  font-size:clamp(1.15rem,2.3vw,1.75rem);
  line-height:1.15;
  text-decoration:none;
  background:var(--fuego-h);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
  transition:transform 200ms var(--ease);
}
.correo::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:var(--fuego-h);
  box-shadow:0 0 14px rgba(255,23,169,.55);
  transform:scaleX(.18);transform-origin:left;
  transition:transform 420ms var(--ease);
}
.correo:hover::after,.correo:focus-visible::after{transform:none}
.correo:active{transform:translateY(1px)}

/* La foto pequeña de la home entera: una ventana estrecha por la que la
   captura completa baja despacio, se detiene abajo y vuelve a subir */
.home{margin:0;display:flex;flex-direction:column;align-items:center;gap:14px}
.ventana{
  position:relative;
  width:var(--ventana-w);height:var(--ventana-h);
  overflow:hidden;
  border-radius:14px;
  border:1.5px solid rgba(100,254,218,.7);
  box-shadow:0 0 0 1px rgba(0,0,0,.6), 0 0 36px -8px rgba(100,254,218,.45), 10px 10px 0 -2px var(--azul);
  background:var(--negro-2);
}
/* bordes en sombra arriba y abajo: se lee como una ventana a una página larga */
.ventana::after{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(180deg, rgba(11,11,15,.55), transparent 9%, transparent 91%, rgba(11,11,15,.6));
}
.ventana img{
  width:100%;height:auto;
  animation:recorre 76s cubic-bezier(.45,0,.55,1) 1.2s infinite both;
}
@keyframes recorre{
  0%,5%{transform:translateY(0)}
  45%,55%{transform:translateY(calc(-100% + var(--ventana-h)))}
  95%,100%{transform:translateY(0)}
}
.ventana:hover img,.ventana:focus-visible img{animation-play-state:paused}
.home figcaption{font-size:.88rem;color:var(--texto-suave)}

/* Una sola entrada al cargar: el texto sube y la ventana se asienta */
.aviso__texto,.home{animation:entra 900ms var(--ease) both}
.home{animation-delay:180ms}
@keyframes entra{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

@media (max-width:859px){
  :root{--ventana-w:min(240px,70vw);--ventana-h:clamp(200px, calc(100svh - 380px), 300px)}
  .aviso{grid-template-columns:1fr;align-content:start}
  .aviso__t{max-width:22ch}
}

/* Movimiento reducido: nada se mueve solo; la ventana se recorre a mano */
/* en móviles estrechos el correo encoge para caber en una línea */
@media (max-width:389px){.correo{font-size:4.9vw}}

@media (prefers-reduced-motion:reduce){
  .ventana img,.aviso__texto,.home{animation:none}
  .ventana{overflow-y:auto;overscroll-behavior:contain}
  .correo,.correo::after{transition:none}
}
</style>
</head>
<body>
  <header class="cab">
    <img src="assets/img/logo-360.png" alt="Latin Urban Dance &amp; Fitness" width="360" height="225">
  </header>

  <main class="aviso">
    <div class="aviso__texto">
      <h1 class="aviso__t">No puedes ver esta página porque han pasado más de 10 días desde su envío.</h1>
      <p class="aviso__p">Si sigues con interés, escríbeme a<br>
        <span class="junto"><a class="correo" href="mailto:jjuradogarciadelrio@gmail.com?subject=Propuesta%20de%20nueva%20web%20%E2%80%94%20Latin%20Urban%20Dance%20%26%20Fitness">jjuradogarciadelrio@gmail.com</a>.</span></p>
    </div>

    <figure class="home">
      <div class="ventana" tabindex="0" role="region" aria-label="Captura de la propuesta de nueva home, completa">
        <img src="assets/img/home-completa.webp" width="600" height="4549"
             alt="La propuesta de nueva home de Latin Urban Dance &amp; Fitness completa, de arriba abajo: el rótulo del studio, las disciplinas, el método, las clases como discos, el horario, el equipo, los bonos, la gira y la formación de instructores.">
      </div>
      <figcaption>La propuesta de nueva home, de arriba abajo.</figcaption>
    </figure>
  </main>
</body>
</html>
